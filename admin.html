<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#064e3b"/>
  <title>Admin — E-Voting OSIS</title>
  <link href="/src/css/input.css" rel="stylesheet"/>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Admin Header -->
    <div class="flex items-center gap-3 mb-6 animate-fade-in">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-slate-700 to-slate-900 flex items-center justify-center shadow-lg">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-slate-800">Dashboard Admin</h1>
        <p class="text-xs text-slate-400">SMK YPM 14 Sumobito — Panel Kendali</p>
      </div>
    </div>

    <!-- Login Card -->
    <div id="login-admin" class="max-w-md mx-auto animate-slide-up">
      <div class="bg-white rounded-2xl shadow-elevated border border-slate-100 p-8">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">
            <svg class="w-5 h-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <div>
            <h2 class="font-bold text-slate-800">Login Admin</h2>
            <p class="text-xs text-slate-400">Akses khusus panitia</p>
          </div>
        </div>
        <div class="space-y-3">
          <input id="admin-email" type="email" placeholder="Email admin" class="input-field"/>
          <input id="admin-pass" type="password" placeholder="Password" class="input-field"/>
          <button id="admin-login" class="btn-primary w-full">Masuk</button>
        </div>
      </div>
    </div>

    <!-- Dashboard Panel -->
    <div id="panel" class="hidden space-y-6 animate-slide-up">
      <!-- Status Bar -->
      <div class="bg-white rounded-2xl shadow-card border border-slate-100 p-5 flex flex-col sm:flex-row items-start sm:items-center gap-4">
        <div class="flex-1">
          <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Status Voting</h2>
          <span id="status" class="text-2xl font-extrabold mt-1"></span>
        </div>
        <div class="flex gap-2">
          <button id="btn-open" class="btn-success text-sm px-5 py-2.5 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Buka Voting
          </button>
          <button id="btn-close" class="btn-danger text-sm px-5 py-2.5 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            Tutup Voting
          </button>
        </div>
      </div>

      <!-- Two Column Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Candidates Section -->
        <section class="section-card">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-9 h-9 rounded-lg bg-brand-100 flex items-center justify-center">
              <svg class="w-5 h-5 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <h2 class="font-bold text-slate-800">Kandidat</h2>
          </div>
          <form id="cand-form" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <input name="nomor_urut" type="number" placeholder="No. Urut" class="input-field" required/>
              <input name="nama_ketua" placeholder="Nama Ketua" class="input-field" required/>
              <input name="nama_wakil" placeholder="Nama Wakil" class="input-field" required/>
              <input name="foto_url" placeholder="Foto URL (opsional)" class="input-field"/>
            </div>
            <textarea name="visi" placeholder="Visi kandidat..." class="input-field min-h-[80px] resize-none"></textarea>
            <button class="btn-primary w-full text-sm">Simpan Kandidat</button>
          </form>
          <div id="cand-list" class="mt-4 space-y-2"></div>
        </section>

        <!-- Voters & Partisipasi -->
        <div class="space-y-6">
          <section class="section-card">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-9 h-9 rounded-lg bg-blue-100 flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              </div>
              <h2 class="font-bold text-slate-800">Import Voters (CSV)</h2>
            </div>
            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-200 rounded-xl cursor-pointer hover:border-brand-400 hover:bg-brand-50 transition-all duration-200">
              <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              <span class="text-sm font-medium text-slate-500">Klik atau seret file CSV</span>
              <span class="text-xs text-slate-400">nis,nama,kelas</span>
              <input id="csv-file" type="file" accept=".csv" class="hidden"/>
            </label>
            <div id="voter-stats" class="mt-3 text-sm"></div>
            <div id="voter-table" class="mt-3 max-h-48 overflow-auto rounded-xl border border-slate-100 text-xs"></div>
          </section>

          <section class="section-card">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-9 h-9 rounded-lg bg-amber-100 flex items-center justify-center">
                <svg class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              </div>
              <h2 class="font-bold text-slate-800">Partisipasi</h2>
            </div>
            <div id="participation" class="space-y-2"></div>
          </section>
        </div>
      </div>

      <!-- Results Section (Full Width) -->
      <section class="section-card">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-purple-100 flex items-center justify-center">
              <svg class="w-5 h-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            <div>
              <h2 class="font-bold text-slate-800">Hasil Pemilihan</h2>
              <p class="text-xs text-slate-400">Terkunci sampai voting ditutup</p>
            </div>
          </div>
          <button id="show-results" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-all duration-200 shadow-md hover:shadow-lg flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Buka Hasil & Cetak PDF
          </button>
        </div>
        <canvas id="chart" class="mt-4 hidden"></canvas>
        <div id="results" class="mt-4 space-y-3"></div>
      </section>
    </div>
  </div>
  <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
