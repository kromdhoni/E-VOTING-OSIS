<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#059669"/>
  <title>Pilih Kandidat — E-Voting OSIS</title>
  <link href="/src/css/input.css" rel="stylesheet"/>
</head>
<body class="gradient-bg min-h-screen">
  <!-- Top Bar -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-slate-100">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl gradient-hero flex items-center justify-center shadow-glow">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-800">Pilih Kandidat</h1>
          <p class="text-[10px] text-slate-400">Tentukan pilihan Anda</p>
        </div>
      </div>
      <button id="logout" class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-red-500 transition-colors px-3 py-2 rounded-xl hover:bg-red-50">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Keluar
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Candidates Grid -->
    <div id="candidates" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- Confirm Dialog -->
  <dialog id="confirm">
    <div class="p-6 sm:p-8 text-center max-w-sm">
      <div class="w-16 h-16 rounded-full bg-brand-100 flex items-center justify-center mx-auto mb-4 animate-scale-in">
        <svg class="w-8 h-8 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h3 class="text-xl font-bold text-slate-800 mb-2">Konfirmasi Pilihan</h3>
      <p id="confirm-text" class="text-slate-500 text-sm mb-6"></p>
      <div class="flex gap-3">
        <button id="confirm-no" class="btn-secondary flex-1">Batal</button>
        <button id="confirm-yes" class="btn-primary flex-1">Ya, Pilih</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/src/js/vote.js"></script>
</body>
</html>
