<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#059669"/>
  <title>Terima Kasih — E-Voting OSIS</title>
  <link href="/src/css/input.css" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-50 via-white to-emerald-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md animate-scale-in">
    <!-- Success Card -->
    <div class="bg-white rounded-3xl shadow-elevated border border-brand-100 p-8 text-center">
      <!-- Animated Check -->
      <div class="relative w-24 h-24 mx-auto mb-6">
        <div class="absolute inset-0 rounded-full bg-brand-100 animate-pulse-slow"></div>
        <div class="relative w-24 h-24 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-glow-lg">
          <svg class="w-12 h-12 text-white animate-fade-in" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>

      <h1 class="text-2xl font-extrabold text-slate-800 mb-2 font-display">Terima Kasih!</h1>
      <p class="text-slate-500 text-sm">Suara Anda sudah tercatat dengan aman</p>

      <!-- Proof Code -->
      <div class="mt-6 bg-slate-50 rounded-2xl p-5 border border-slate-100">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kode Bukti Anonim</p>
        <div id="code" class="font-mono text-2xl font-extrabold text-brand-600 tracking-[0.2em]"></div>
        <p class="text-[10px] text-slate-400 mt-2">Simpan kode ini sebagai bukti Anda sudah memilih</p>
      </div>

      <!-- Info -->
      <div class="mt-4 flex items-center gap-2 bg-amber-50 rounded-xl p-3 border border-amber-100">
        <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-xs text-amber-700">Hasil pemilihan akan diumumkan setelah voting ditutup oleh panitia.</p>
      </div>

      <!-- Logout -->
      <button onclick="sessionStorage.clear();location.href='vote.html'" class="btn-primary w-full mt-6 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Logout — Device Siap
      </button>
    </div>
  </div>
  <script>document.getElementById('code').textContent = sessionStorage.getItem('thank_code')||'-';</script>
</body>
</html>
