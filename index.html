<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <link rel="icon" type="image/png" href="./logo-sekolah.png"/>
  <title>E-Voting OSIS SMK YPM 14</title>
  <link href="/src/css/input.css" rel="stylesheet" />
</head>
<body class="gradient-bg min-h-screen">
  <main class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md animate-fade-in">
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-4 mb-4 animate-float">
          <img src="./logo-sekolah.png" alt="Logo SMK YPM 14" class="w-20 h-20 rounded-2xl object-contain bg-white shadow-glow-lg p-1"/>
          <img src="./logo-osis.png" alt="Logo OSIS" class="w-20 h-20 rounded-full object-cover bg-white shadow-glow-lg"/>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 font-display">E-Voting OSIS</h1>
        <p class="text-slate-500 mt-1 font-medium">SMK YPM 14 Sumobito</p>
      </div>

      <!-- Login Card -->
      <div class="card p-8 animate-slide-up">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 rounded-xl bg-brand-100 flex items-center justify-center">
            <svg class="w-5 h-5 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-800">Masuk ke Sistem</h2>
            <p class="text-xs text-slate-400">Gunakan NIS & Token dari panitia</p>
          </div>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">NIS</label>
            <input id="nis" type="text" inputmode="numeric" placeholder="Masukkan NIS Anda" class="input-field" required />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">Token 6 Digit <span class="text-slate-300">(opsional untuk voting langsung)</span></label>
            <input id="token" type="text" inputmode="numeric" maxlength="6" placeholder="Kosongkan jika voting langsung" class="input-field font-mono tracking-widest text-center text-lg" />
          </div>
          <button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 5v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Masuk
          </button>
          <p id="error" class="text-red-500 text-sm text-center hidden bg-red-50 p-3 rounded-xl border border-red-100 animate-slide-down"></p>
        </form>
      </div>

      <!-- Footer -->
          <p class="text-xs text-slate-400 mt-6">Pemilihan Ketua & Wakil OSIS 2026</p>
          <p class="text-[10px] text-slate-300 mt-1">Langsung ke <a href="vote.html" class="underline">vote.html</a> untuk voting langsung</p>
    </div>
  </main>
  <script type="module" src="/src/js/auth.js"></script>
</body>
</html>
